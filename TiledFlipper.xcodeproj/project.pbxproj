/* Begin PBXShellScriptBuildPhase section */
		17E14FA03031FB840036D130 /* Embed Artwork Package Endpoint */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			inputPaths = (
				"$(SRCROOT)/ArtworkPackageEndpoint.local.txt",
			);
			name = "Embed Artwork Package Endpoint";
			outputPaths = (
				"$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ArtworkPackageEndpoint.plist",
			);
			shellPath = /bin/sh;
			shellScript = (
				"# Albumartworks の配布 URL はリポジトリに置かない。",
				"# ${SRCROOT}/ArtworkPackageEndpoint.local.txt (git 管理外) から読んで、",
				"# アプリバンドルの ArtworkPackageEndpoint.plist に埋め込む。",
				"set -euo pipefail",
				"",
				"ENDPOINT_FILE=\"${SRCROOT}/ArtworkPackageEndpoint.local.txt\"",
				"OUTPUT_PLIST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ArtworkPackageEndpoint.plist\"",
				"",
				"ENDPOINT=\"\"",
				"if [ -f \"${ENDPOINT_FILE}\" ]; then",
				"    # コメント (#) と空行を飛ばして、最初の 1 行だけを URL として使う。",
				"    ENDPOINT=$(grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' \"${ENDPOINT_FILE}\" | head -n 1 | tr -d '[:space:]' || true)",
				"fi",
				"",
				"if [ -z \"${ENDPOINT}\" ]; then",
				"    echo \"warning: ${ENDPOINT_FILE} に配布 URL がありません (オンラインのコレクションは出ません)\"",
				"fi",
				"",
				"# URL が無いときも空の plist を作る。declared output なので必ず要る。",
				"mkdir -p \"$(dirname \"${OUTPUT_PLIST}\")\"",
				"rm -f \"${OUTPUT_PLIST}\"",
				"/usr/libexec/PlistBuddy -c \"Add :ArtworkPackageURL string ${ENDPOINT}\" -c \"Save\" \"${OUTPUT_PLIST}\" > /dev/null",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

